services:
  app:
    build: .
    image: hardening-app:1.0.0
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:?defina no .env}
      DB_USER: ${DB_USER:?defina no .env}
      DB_PASSWORD: ${DB_PASSWORD:?defina no .env}
      DB_NAME: ${DB_NAME:?defina no .env}
    ports:
      - "127.0.0.1:3000:3000"
    networks: [frontend, backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  banco:
    image: mysql:8.4.3
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?defina no .env}
      MYSQL_DATABASE: ${DB_NAME:?defina no .env}
      MYSQL_USER: ${DB_USER:?defina no .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina no .env}
    expose: ["3306"]
    networks: [backend]
    volumes:
      - banco_data:/var/lib/mysql
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

networks:
  frontend:
  backend:
    internal: true

volumes:
  banco_data: